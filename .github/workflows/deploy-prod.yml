# Production frontend deploy for Tylo One.
# Push to the prod branch only. QA uses a separate workflow.
#
# Official actions: checkout + setup-node (v5 = Node 24 runtime).
# Deploy itself is ssh/rsync so the VPS does not need GitHub credentials.
#
# Vite bakes VITE_* into the static build. There is no server-side .env on
# /var/www/tylo-one/prod/frontend/. Set optional build-time values as GitHub
# Environment variables/secrets on the prod environment:
#   VITE_BACKEND_URL          (prod defaults to https://api.tylo.systems —
#                             tylo.systems nginx does not proxy /api yet)
#   VITE_GOOGLE_MAPS_API_KEY  (optional)
#
# Required prod environment SSH secrets (mirror of QA names on this repo):
#   PROD_SSH_HOST
#   PROD_SERVER_USER
#   PROD_SERVER_SSH_KEY

name: Deploy Prod Frontend

on:
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: tylo-one-prod-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, build, and deploy Prod frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Vite/Tailwind live in devDependencies — do not omit them.
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        env:
          # Prod SPA is on tylo.systems; API is on api.tylo.systems (CORS + credentials).
          # Do not use same-origin /api until nginx proxies /api on tylo.systems.
          # Never bake the Render URL — that breaks refresh cookies / logout.
          VITE_BACKEND_URL: https://api.tylo.systems
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          if grep -R -n -E 'huedora-projects-server\.onrender\.com' dist/ >/dev/null 2>&1; then
            echo "Prod build unexpectedly baked the Render API URL."
            exit 1
          fi
          if ! grep -R -n -F 'api.tylo.systems' dist/ >/dev/null 2>&1; then
            echo "Prod build missing api.tylo.systems backend URL."
            exit 1
          fi
          echo "Built with VITE_BACKEND_URL=https://api.tylo.systems"

      - name: Configure SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          PROD_SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${PROD_SSH_HOST}" ]] || missing+=("PROD_SSH_HOST")
          [[ -n "${PROD_SERVER_USER}" ]] || missing+=("PROD_SERVER_USER")
          [[ -n "${PROD_SERVER_SSH_KEY}" ]] || missing+=("PROD_SERVER_SSH_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secret(s): ${missing[*]}"
            echo "Add them to the prod environment on ashish-sync/Huedora-Projects."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${PROD_SERVER_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/prod_deploy_key"
          chmod 600 "${HOME}/.ssh/prod_deploy_key"
          # Validate key shape without printing the key material.
          if ! ssh-keygen -y -f "${HOME}/.ssh/prod_deploy_key" >/dev/null 2>&1; then
            echo "PROD_SERVER_SSH_KEY is not a valid private key (paste the full OpenSSH private key)."
            exit 1
          fi
          scanned=0
          for _ in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "${PROD_SSH_HOST}" >> "${HOME}/.ssh/known_hosts" 2>/tmp/ssh-keyscan.err; then
              scanned=1
              break
            fi
            sleep 3
          done
          if [[ "${scanned}" != "1" ]]; then
            echo "ssh-keyscan failed for PROD_SSH_HOST (check the host/IP and that port 22 is reachable)."
            # Do not print the host value (it is a secret). Show only scanner stderr class.
            sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/<host>/g; s/[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<host>/g' /tmp/ssh-keyscan.err || true
            exit 1
          fi
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Ensure frontend directory on VPS
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/prod_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${PROD_SERVER_USER}@${PROD_SSH_HOST}" \
            'mkdir -p /var/www/tylo-one/prod/frontend'

      - name: Rsync dist to VPS
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete --stats \
            -e "ssh -i ${HOME}/.ssh/prod_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./dist/ "${PROD_SERVER_USER}@${PROD_SSH_HOST}:/var/www/tylo-one/prod/frontend/"

      - name: Verify deployed files
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/prod_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${PROD_SERVER_USER}@${PROD_SSH_HOST}" 'bash -s' << 'REMOTE'
          set -eo pipefail
          DEST=/var/www/tylo-one/prod/frontend
          if [[ ! -f "${DEST}/index.html" ]]; then
            echo "Deploy verification failed: ${DEST}/index.html is missing."
            exit 1
          fi
          if [[ ! -d "${DEST}/assets" ]]; then
            echo "Deploy verification failed: ${DEST}/assets is missing."
            exit 1
          fi
          echo "Prod frontend deploy OK:"
          ls -la "${DEST}" | head -20
          REMOTE
