# Production frontend deploy for Tylo One.
# Push to the prod branch only. QA uses a separate workflow.
#
# Official actions: checkout + setup-node (v5 = Node 24 runtime).
# Deploy itself is ssh/rsync so the VPS does not need GitHub credentials.
#
# Vite bakes VITE_* into the static build. There is no server-side .env on
# /var/www/tylo-one/prod/frontend/. Set optional build-time values as GitHub
# Environment variables/secrets on the prod environment:
#   VITE_BACKEND_URL          (optional; empty = same-origin /api/v1)
#   VITE_GOOGLE_MAPS_API_KEY  (optional)
#
# Required prod environment SSH secrets (mirror of QA names on this repo):
#   PROD_SSH_HOST
#   PROD_SERVER_USER
#   PROD_SERVER_SSH_KEY

name: Deploy Prod Frontend

on:
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: tylo-one-prod-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, build, and deploy Prod frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Vite/Tailwind live in devDependencies — do not omit them.
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || secrets.VITE_BACKEND_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          echo "Built with VITE_BACKEND_URL=${VITE_BACKEND_URL:-<empty/same-origin>}"

      - name: Configure SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          PROD_SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${PROD_SSH_HOST}" ]] || missing+=("PROD_SSH_HOST")
          [[ -n "${PROD_SERVER_USER}" ]] || missing+=("PROD_SERVER_USER")
          [[ -n "${PROD_SERVER_SSH_KEY}" ]] || missing+=("PROD_SERVER_SSH_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secret(s): ${missing[*]}"
            echo "Add them to the prod environment on ashish-sync/Huedora-Projects."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${PROD_SERVER_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/prod_deploy_key"
          chmod 600 "${HOME}/.ssh/prod_deploy_key"
          ssh-keyscan -H "${PROD_SSH_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Ensure frontend directory on VPS
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/prod_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${PROD_SERVER_USER}@${PROD_SSH_HOST}" \
            'mkdir -p /var/www/tylo-one/prod/frontend'

      - name: Rsync dist to VPS
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete --stats \
            -e "ssh -i ${HOME}/.ssh/prod_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./dist/ "${PROD_SERVER_USER}@${PROD_SSH_HOST}:/var/www/tylo-one/prod/frontend/"

      - name: Verify deployed files
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/prod_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${PROD_SERVER_USER}@${PROD_SSH_HOST}" 'bash -s' << 'REMOTE'
          set -eo pipefail
          DEST=/var/www/tylo-one/prod/frontend
          if [[ ! -f "${DEST}/index.html" ]]; then
            echo "Deploy verification failed: ${DEST}/index.html is missing."
            exit 1
          fi
          if [[ ! -d "${DEST}/assets" ]]; then
            echo "Deploy verification failed: ${DEST}/assets is missing."
            exit 1
          fi
          echo "Prod frontend deploy OK:"
          ls -la "${DEST}" | head -20
          REMOTE
