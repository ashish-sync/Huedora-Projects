<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="TYLO One" />
    <meta name="theme-color" content="#0A5AC2" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>TYLO One</title>
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var ua = navigator.userAgent || '';
          var isChrome = /Chrome\//.test(ua) && !/Edg\//.test(ua) && !/OPR\//.test(ua);
          var isDesktop = window.matchMedia('(min-width: 641px)').matches;
          if (isChrome && isDesktop) {
            root.setAttribute('data-ua-chrome', '1');
            root.style.zoom = '0.95';
          }
        } catch (e) {}

        try {
          var t = localStorage.getItem('tylo-one-theme');
          if (t === 'dark' || t === 'light') {
            root.setAttribute('data-theme', t);
            try {
              localStorage.setItem('tylo-one-theme', t);
              var meta = document.querySelector('meta[name="theme-color"]');
              if (meta) meta.setAttribute('content', t === 'dark' ? '#111827' : '#0A5AC2');
            } catch (e) {}
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            root.setAttribute('data-theme', 'dark');
            try {
              var m = document.querySelector('meta[name="theme-color"]');
              if (m) m.setAttribute('content', '#111827');
            } catch (e2) {}
          } else {
            root.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          root.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      /* Default desktop density (~95% browser zoom) in Chrome — before the app bundle loads */
      @media (min-width: 641px) {
        html[data-ua-chrome='1'] {
          zoom: 0.95;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
